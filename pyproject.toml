    "dashscope==1.25.12",
    "dashvector==1.0.23",
    "dbutils==3.1.2",
    "flask==3.1.2",
    "flask-login==0.6.3",
    "flask-session>=0.8.0",
    "gunicorn==23.0.0",
    "langchain-text-splitters==1.1.0",
    "loguru==0.7.3",
    "markitdown[docx,pdf,pptx,xls,xlsx]==0.1.4",
    "openai==2.11.0",
    "pycryptodome==3.23.0",
    "pymysql==1.1.2",
    "pyotp==2.9.0",
    "pypdf2==3.0.1",
    "python-dotenv==1.2.1",
    "python-multipart==0.0.22",
    "pytz==2025.2",
    "qrcode==8.2",
    "redis==7.3.0",
    "requests==2.32.5",
    "mineru==3.4.5"
